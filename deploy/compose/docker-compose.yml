name: driftline
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: driftline
      POSTGRES_PASSWORD: driftline
      POSTGRES_DB: driftline
    ports: ["${DRIFTLINE_POSTGRES_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftline"]
      interval: 5s
      retries: 10
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  gateway:
    build: ../../backend
    environment:
      DRIFTLINE_DATABASE_URL: postgresql://driftline:driftline@postgres:5432/driftline
      DRIFTLINE_REDIS_URL: redis://redis:6379/0
      DRIFTLINE_ANTHROPIC_API_KEY: ${DRIFTLINE_ANTHROPIC_API_KEY:-}
      DRIFTLINE_GEMINI_API_KEY: ${DRIFTLINE_GEMINI_API_KEY:-}
      DRIFTLINE_EMBED_URL: http://embedder:80
    ports: ["${DRIFTLINE_GATEWAY_PORT:-8010}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      embedder: {condition: service_healthy}
  embedder:
    # Hugging Face TEI; native arm64 tag by default. On amd64 hosts set
    # DRIFTLINE_EMBED_IMAGE=ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    image: ${DRIFTLINE_EMBED_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9.4}
    command: ["--model-id", "BAAI/bge-base-en-v1.5"]
    ports: ["${DRIFTLINE_EMBED_PORT:-8080}:80"]
    volumes: [embedder-models:/data]
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
volumes:
  pgdata: {}
  embedder-models: {}
