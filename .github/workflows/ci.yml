name: ci
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      UV_LINK_MODE: copy
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # Node still runs the Node-shebang tools (Vitest, openapi-typescript); Bun installs and runs scripts.
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: frontend/package.json
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      # Lighthouse, report only: scores never fail the job. The report is an artifact.
      - name: Lighthouse (report only)
        continue-on-error: true
        run: >-
          bunx @lhci/cli@0.15.1 collect
          --start-server-command="bun run start"
          --url=http://localhost:3000/
          --url=http://localhost:3000/ask
          --number-of-runs=1
          && bunx @lhci/cli@0.15.1 upload --target=filesystem --outputDir=lhci-report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: frontend/lhci-report
          if-no-files-found: ignore
