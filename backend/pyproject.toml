[project]
name = "driftline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "asyncpg>=0.29",
  "redis>=5.0",
  "alembic>=1.13",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "google-genai>=1.0",
  "httpx>=0.27",
  "anthropic>=2.3.0",
  "llama-index-core>=0.14.25",
  "defusedxml>=0.7.1",
  "pypdf>=6.0",
  "python-docx>=1.2",
  "pyyaml>=6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "testcontainers[postgres,redis]>=4.8",
  "pytest-recording>=0.13",
  "vcrpy>=6.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/driftline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "slow: runs against a real embedder container (still runs by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
